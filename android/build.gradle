group 'network.mysterium.wireguard_dart'
version '1.0-SNAPSHOT'

ext.wireguard_tunnel_version = '1.0.20260102'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
    }

    namespace 'network.mysterium.wireguard_dart'
}

dependencies {
    implementation "com.wireguard.android:tunnel:$wireguard_tunnel_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation 'com.beust:klaxon:5.6'
    implementation 'androidx.appcompat:appcompat:1.7.1'

    /// to run wireguard on Android 25 or lower
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

project.tasks.configureEach { task ->
    if (task.name.contains("compile") && task.name.contains("Kotlin")) {
        try {
            task.kotlinOptions.jvmTarget = "17"
        } catch (Exception e) {
            // Ignore
        }
    }
}
